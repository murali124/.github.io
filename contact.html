<div class="container">
    <h1 class="gradient-text">Reach Out</h1>
    <p>We are currently available for new projects and consultations.</p>

    <div class="contact-card">
        <div class="info-item">
            <small>Our Office</small>
            <h3>123 Innovation Drive, Suite 500<br>Silicon Valley, CA 94025</h3>
        </div>

        <hr class="divider">

        <div class="info-item">
            <small>Phone Number</small>
            <h3>+1 (555) 012-3456</h3>
        </div>

        <div class="info-item">
            <small>Email Address</small>
            <h3>hello@modernweb.com</h3>
        </div>

        <hr class="divider">

        <div class="contact-wrapper" style="margin: 0; padding: 0; background: transparent; text-align: left;">
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="4" placeholder="Your message..." required></textarea>
                </div>
                <button type="submit" class="btn-primary">Send Message</button>
            </form>
            <div id="form-feedback"
                style="display: none; margin-top: 20px; color: green; font-weight: bold; text-align: center;">Message
                Sent Successfully!</div>
        </div>
    </div>
</div>
